<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1" fill="#10b981" fill-opacity="0.2" />
    </pattern>

    <!-- Foliage Gradient -->
    <linearGradient id="foliage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Arch Blue Gradient -->
    <linearGradient id="arch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1793d1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="280" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="960" height="280" rx="14" fill="url(#cyber-grid)" />

  <!-- Outer Border Highlight -->
  <rect x="1" y="1" width="958" height="278" rx="13" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />

  <!-- Terminal Window Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 946 0 Q 960 0 960 14 L 960 38 L 0 38 Z" fill="#0b111c" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="25" cy="19" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="43" cy="19" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="61" cy="19" r="5.5" fill="#10b981" opacity="0.85" />

  <!-- Terminal Title -->
  <text x="50%" y="23" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11.5" fill="#64748b" letter-spacing="1">
    habnoir@archbox: ~ (zsh) — 960x280 — UTF-8
  </text>

  <!-- Left: Pixel Bonsai Tree Illustration -->
  <g transform="translate(45, 60)">
    <!-- Decorative Ambient Glow behind Bonsai -->
    <circle cx="95" cy="95" r="75" fill="#10b981" opacity="0.08" filter="url(#emerald-glow)" />

    <!-- Bonsai Pot (Hexagonal / Minimal Cyber Pot) -->
    <polygon points="45,160 145,160 135,178 55,178" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="52" y="178" width="86" height="5" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Soil / Grass Line -->
    <line x1="48" y1="160" x2="142" y2="160" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

    <!-- Trunk (Stylized Angled Bonsai Trunk) -->
    <!-- Base Trunk -->
    <path d="M 90 160 Q 86 135 102 120 T 96 85 Q 92 65 110 50" fill="none" stroke="#854d0e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 90 160 Q 86 135 102 120 T 96 85 Q 92 65 110 50" fill="none" stroke="#a16207" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Branch Left -->
    <path d="M 97 122 Q 80 115 62 110" fill="none" stroke="#854d0e" stroke-width="5" stroke-linecap="round" />
    <path d="M 97 122 Q 80 115 62 110" fill="none" stroke="#a16207" stroke-width="3" stroke-linecap="round" />
    <!-- Branch Right High -->
    <path d="M 97 90 Q 120 85 138 78" fill="none" stroke="#854d0e" stroke-width="4.5" stroke-linecap="round" />
    <!-- Branch Left High -->
    <path d="M 96 75 Q 80 65 68 58" fill="none" stroke="#854d0e" stroke-width="3.5" stroke-linecap="round" />

    <!-- Foliage Cloud 1: Main Top Canopy -->
    <ellipse cx="112" cy="42" rx="34" ry="17" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="102" cy="36" rx="22" ry="13" fill="#6ee7b7" opacity="0.6" />
    <ellipse cx="126" cy="44" rx="18" ry="11" fill="#047857" opacity="0.5" />

    <!-- Foliage Cloud 2: Middle Right Tier -->
    <ellipse cx="140" cy="74" rx="26" ry="14" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="134" cy="70" rx="16" ry="9" fill="#6ee7b7" opacity="0.6" />
    <ellipse cx="150" cy="77" rx="14" ry="8" fill="#047857" opacity="0.5" />

    <!-- Foliage Cloud 3: Middle Left Tier -->
    <ellipse cx="58" cy="106" rx="28" ry="15" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="52" cy="102" rx="18" ry="10" fill="#6ee7b7" opacity="0.6" />
    <ellipse cx="68" cy="109" rx="14" ry="8" fill="#047857" opacity="0.5" />

    <!-- Foliage Cloud 4: Upper Left Accent -->
    <ellipse cx="65" cy="55" rx="19" ry="11" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="62" cy="52" rx="12" ry="7" fill="#6ee7b7" opacity="0.6" />

    <!-- Falling Digital Leaf / Pixels -->
    <rect x="75" y="135" width="4" height="4" fill="#34d399" opacity="0.8" />
    <rect x="125" y="115" width="3" height="3" fill="#10b981" opacity="0.7" />
    <rect x="145" y="130" width="3" height="3" fill="#6ee7b7" opacity="0.6" />
    <rect x="85" y="148" width="4" height="4" fill="#34d399" opacity="0.7" />
    
    <!-- Plant Label -->
    <text x="95" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" opacity="0.8" letter-spacing="1">
      GIT-BONSAI // LIVING REPO
    </text>
  </g>

  <!-- Vertical Divider with Neon Dot -->
  <line x1="260" y1="52" x2="260" y2="258" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="260" cy="155" r="3" fill="#10b981" filter="url(#soft-glow)" />

  <!-- Right Section: Identity, Specs, Stack -->
  <g transform="translate(290, 62)">
    <!-- Terminal Prompt Line -->
    <g transform="translate(0, 14)">
      <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">
        <tspan fill="#10b981">➜</tspan>
        <tspan fill="#38bdf8"> ~</tspan>
        <tspan fill="#64748b"> git checkout </tspan>
        <tspan fill="#f1f5f9">habNoir</tspan>
        <tspan fill="#10b981" font-weight="bold"> (kernel-mainline)</tspan>
      </text>
    </g>

    <!-- Main Name Title -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', system-ui, -apple-system, monospace" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
        habNoir
      </text>
      <!-- Blinking Cursor -->
      <rect x="162" y="-26" width="12" height="30" fill="#10b981" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Subtitle / Bio -->
    <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#94a3b8" letter-spacing="0.3">
      Systems &amp; Low-Level Hacker <tspan fill="#10b981">|</tspan> Backend Engineer <tspan fill="#10b981">|</tspan> Android Modder
    </text>

    <!-- Custom Badges / Pills Bar -->
    <g transform="translate(0, 96)">
      <!-- Badge: Arch Linux -->
      <g transform="translate(0, 0)">
        <rect width="112" height="24" rx="5" fill="#0f172a" stroke="#1793d1" stroke-width="1.2" />
        <circle cx="12" cy="12" r="3.5" fill="#1793d1" />
        <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">Arch Linux</text>
      </g>

      <!-- Badge: C++ / Low-Level -->
      <g transform="translate(120, 0)">
        <rect width="66" height="24" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
        <text x="33" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#60a5fa">C++20</text>
      </g>

      <!-- Badge: Python -->
      <g transform="translate(194, 0)">
        <rect width="78" height="24" rx="5" fill="#0f172a" stroke="#eab308" stroke-width="1.2" />
        <text x="39" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#facc15">Python</text>
      </g>

      <!-- Badge: Node.js -->
      <g transform="translate(280, 0)">
        <rect width="84" height="24" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" />
        <text x="42" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ade80">Node.js</text>
      </g>

      <!-- Badge: PHP -->
      <g transform="translate(372, 0)">
        <rect width="58" height="24" rx="5" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="29" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a5b4fc">PHP</text>
      </g>

      <!-- Badge: Apache -->
      <g transform="translate(438, 0)">
        <rect width="88" height="24" rx="5" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" />
        <text x="44" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#fb7185">Apache 2.4</text>
      </g>

      <!-- Badge: Android Modding -->
      <g transform="translate(534, 0)">
        <rect width="108" height="24" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <text x="54" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34d399">Android Re/Mod</text>
      </g>
    </g>

    <!-- Terminal Status Info Row -->
    <g transform="translate(0, 142)">
      <rect width="642" height="38" rx="6" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
      
      <!-- Metric 1: OS / Kernel -->
      <text x="16" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
        HOST: <tspan fill="#e2e8f0" font-weight="600">arch-rolling</tspan>
      </text>

      <line x1="160" y1="8" x2="160" y2="30" stroke="#1e293b" stroke-width="1" />

      <!-- Metric 2: Server Engine -->
      <text x="175" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
        HTTPD: <tspan fill="#e2e8f0" font-weight="600">mpm_event/http2</tspan>
      </text>

      <line x1="345" y1="8" x2="345" y2="30" stroke="#1e293b" stroke-width="1" />

      <!-- Metric 3: Focus -->
      <text x="360" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
        MOD: <tspan fill="#e2e8f0" font-weight="600">Magisk / KernelSU / NDK</tspan>
      </text>

      <line x1="535" y1="8" x2="535" y2="30" stroke="#1e293b" stroke-width="1" />

      <!-- Pulse Dot & Status -->
      <circle cx="552" cy="19" r="4" fill="#10b981" filter="url(#soft-glow)" />
      <text x="564" y="23" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#10b981">
        ONLINE
      </text>
    </g>
  </g>
</svg>
