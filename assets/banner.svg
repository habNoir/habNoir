<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Seamless Canvas Match (#0D1117) with Emerald Ambient Gradient -->
    <linearGradient id="forest-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0e2319" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <radialGradient id="banner-ambient-glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Leaf Glow -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bio Organic Grid -->
    <pattern id="nature-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.2" fill="#4ade80" fill-opacity="0.20" />
    </pattern>
  </defs>

  <!-- Seamless Canvas Background Frame (#0D1117) -->
  <rect width="960" height="280" rx="14" fill="url(#forest-bg-grad)" stroke="#165b38" stroke-width="1.2" />
  <rect width="960" height="280" rx="14" fill="url(#banner-ambient-glow)" />
  <rect width="960" height="280" rx="14" fill="url(#nature-grid)" />

  <!-- Inner Nature Highlight Ring -->
  <rect x="1.5" y="1.5" width="957" height="277" rx="12.5" fill="none" stroke="#4ade80" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Top Terminal Bar (GitHub Dark Unified) -->
  <path d="M 0 14 Q 0 0 14 0 L 946 0 Q 960 0 960 14 L 960 38 L 0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#21262d" stroke-width="1" />

  <!-- Terminal Window Dots -->
  <circle cx="25" cy="19" r="5.5" fill="#15803d" opacity="0.9" />
  <circle cx="43" cy="19" r="5.5" fill="#22c55e" opacity="0.9" />
  <circle cx="61" cy="19" r="5.5" fill="#4ade80" opacity="0.9" />

  <!-- Terminal Title -->
  <text x="50%" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#86efac" letter-spacing="1">
    habnoir@arch-forest: ~ (zsh/nature-rice) — LINUX EVERGREEN KERNEL
  </text>

  <!-- Left: Living Pixel Bonsai Tree (100% IDENTICAL TWIN TO SECTION 0x02) -->
  <g transform="translate(8, 48)">
    <!-- Ambient Green Forest Halo -->
    <circle cx="116" cy="110" r="75" fill="#22c55e" opacity="0.12" filter="url(#emerald-glow)" />

    <!-- Top Canopy Pixel Clusters (IDENTICAL TO 0x02) -->
    <!-- Layer 1: Deep Pine Foliage Base -->
    <rect x="76" y="52" width="60" height="20" fill="#052e16" />
    <rect x="68" y="60" width="76" height="24" fill="#052e16" />
    <rect x="52" y="72" width="44" height="20" fill="#052e16" />
    <rect x="132" y="68" width="48" height="20" fill="#052e16" />

    <!-- Layer 2: Mid Emerald Foliage -->
    <rect x="80" y="44" width="48" height="24" fill="#15803d" />
    <rect x="64" y="64" width="72" height="20" fill="#15803d" />
    <rect x="48" y="76" width="36" height="16" fill="#15803d" />
    <rect x="136" y="72" width="40" height="16" fill="#15803d" />
    <rect x="116" y="92" width="36" height="16" fill="#15803d" />

    <!-- Layer 3: Vibrant Nature Green Highlights -->
    <rect x="88" y="40" width="32" height="16" fill="#22c55e" />
    <rect x="72" y="56" width="28" height="12" fill="#22c55e" />
    <rect x="112" y="60" width="32" height="12" fill="#22c55e" />
    <rect x="52" y="80" width="24" height="8" fill="#22c55e" />
    <rect x="144" y="76" width="24" height="8" fill="#22c55e" />

    <!-- Layer 4: Spring Mint / Neon Leaf Pixels -->
    <rect x="92" y="44" width="8" height="8" fill="#4ade80" />
    <rect x="108" y="48" width="12" height="8" fill="#4ade80" />
    <rect x="76" y="60" width="8" height="8" fill="#4ade80" />
    <rect x="124" y="64" width="8" height="8" fill="#4ade80" />
    <rect x="148" y="72" width="8" height="8" fill="#4ade80" />
    <rect x="56" y="76" width="8" height="8" fill="#86efac" />
    <rect x="100" y="40" width="8" height="4" fill="#bbf7d0" />

    <!-- Pixel Branches / Natural Wood Trunk -->
    <rect x="72" y="92" width="24" height="8" fill="#713f12" />
    <rect x="84" y="88" width="16" height="12" fill="#854d0e" />
    
    <rect x="128" y="84" width="24" height="8" fill="#713f12" />
    <rect x="124" y="88" width="16" height="8" fill="#854d0e" />

    <!-- Main Upper Trunk -->
    <rect x="104" y="76" width="16" height="24" fill="#713f12" />
    <rect x="108" y="80" width="8" height="20" fill="#854d0e" />

    <!-- Mid Trunk curve -->
    <rect x="108" y="100" width="20" height="28" fill="#713f12" />
    <rect x="112" y="104" width="12" height="20" fill="#854d0e" />
    <rect x="100" y="116" width="16" height="24" fill="#713f12" />
    <rect x="104" y="120" width="10" height="16" fill="#854d0e" />

    <!-- Lower Trunk & Roots -->
    <rect x="96" y="136" width="32" height="24" fill="#713f12" />
    <rect x="102" y="138" width="18" height="18" fill="#854d0e" />
    <rect x="90" y="152" width="16" height="12" fill="#713f12" />
    <rect x="120" y="152" width="16" height="12" fill="#713f12" />

    <!-- Bonsai Pot (Dark Earth Ceramic) -->
    <rect x="60" y="164" width="112" height="6" fill="#161b22" />
    <rect x="64" y="170" width="104" height="22" fill="#0d1117" stroke="#165b38" stroke-width="1" />
    <!-- Pot Rim Highlight -->
    <rect x="66" y="172" width="100" height="3" fill="#4ade80" opacity="0.7" />
    <!-- Pot Feet -->
    <rect x="76" y="192" width="14" height="6" fill="#06090e" />
    <rect x="142" y="192" width="14" height="6" fill="#06090e" />

    <!-- Rich Moss & Grass on Soil -->
    <rect x="70" y="160" width="92" height="4" fill="#052e16" />
    <rect x="80" y="158" width="12" height="3" fill="#22c55e" />
    <rect x="110" y="158" width="16" height="3" fill="#4ade80" />
    <rect x="136" y="158" width="10" height="3" fill="#22c55e" />

    <!-- Floating / Spore Leaves Effect -->
    <rect x="44" y="116" width="4" height="4" fill="#4ade80" opacity="0.8" />
    <rect x="168" y="108" width="4" height="4" fill="#22c55e" opacity="0.85" />
    <rect x="156" y="132" width="4" height="4" fill="#86efac" opacity="0.7" />
    
    <!-- Plant Label -->
    <text x="116" y="214" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#4ade80" opacity="0.9" letter-spacing="1">
      🌲 LIVING GIT-BONSAI
    </text>
  </g>

  <!-- Vertical Forest Divider -->
  <line x1="248" y1="52" x2="248" y2="258" stroke="#165b38" stroke-width="1.2" />
  <circle cx="248" cy="155" r="3.5" fill="#4ade80" filter="url(#soft-glow)" />

  <!-- Right Section: Identity, Specs, Linux Evergreen Stack -->
  <g transform="translate(276, 62)">
    <!-- Terminal Prompt Line -->
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#a7f3d0">
      <tspan fill="#4ade80">🌲</tspan> <tspan fill="#86efac">habnoir@arch-forest</tspan><tspan fill="#6ee7b7">:~$</tspan> <tspan fill="#f0fdf4">tree /sys/kernel/contributions</tspan>
    </text>

    <!-- Main Name Title -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#f0fdf4" letter-spacing="-0.5">
        habNoir
      </text>
      <!-- Blinking Terminal Cursor positioned safely -->
      <rect x="156" y="-24" width="10" height="28" fill="#4ade80" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>

      <!-- Status Pill Aligned Right -->
      <g transform="translate(545, -20)">
        <rect width="108" height="24" rx="12" fill="#161b22" stroke="#22c55e" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#4ade80" filter="url(#soft-glow)" />
        <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#4ade80">ONLINE // zen</text>
      </g>
    </g>

    <!-- Subtitle / Bio -->
    <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#86efac">
      Arch Linux Hacker <tspan fill="#22c55e">|</tspan> Systems &amp; Low-Level <tspan fill="#22c55e">|</tspan> Android Modder <tspan fill="#22c55e">|</tspan> Apache Engine
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 94)">
      <!-- 1. Arch Linux -->
      <g transform="translate(0, 0)">
        <rect width="104" height="24" rx="4" fill="#161b22" stroke="#22c55e" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#4ade80" />
        <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a7f3d0">Arch Linux</text>
      </g>

      <!-- 2. C++20 -->
      <g transform="translate(110, 0)">
        <rect width="60" height="24" rx="4" fill="#161b22" stroke="#16a34a" stroke-width="1" />
        <text x="30" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">C++20</text>
      </g>

      <!-- 3. Python -->
      <g transform="translate(176, 0)">
        <rect width="72" height="24" rx="4" fill="#161b22" stroke="#15803d" stroke-width="1" />
        <text x="36" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">Python</text>
      </g>

      <!-- 4. Node.js -->
      <g transform="translate(254, 0)">
        <rect width="78" height="24" rx="4" fill="#161b22" stroke="#22c55e" stroke-width="1" />
        <text x="39" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ade80">Node.js</text>
      </g>

      <!-- 5. PHP -->
      <g transform="translate(338, 0)">
        <rect width="52" height="24" rx="4" fill="#161b22" stroke="#16a34a" stroke-width="1" />
        <text x="26" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">PHP</text>
      </g>

      <!-- 6. Apache -->
      <g transform="translate(396, 0)">
        <rect width="86" height="24" rx="4" fill="#161b22" stroke="#22c55e" stroke-width="1" />
        <text x="43" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ade80">Apache 2.4</text>
      </g>

      <!-- 7. Android Mod -->
      <g transform="translate(488, 0)">
        <rect width="102" height="24" rx="4" fill="#161b22" stroke="#4ade80" stroke-width="1" />
        <text x="51" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">Android Mod</text>
      </g>
    </g>

    <!-- Telemetry Row -->
    <g transform="translate(0, 136)">
      <rect width="655" height="42" rx="6" fill="#161b22" stroke="#165b38" stroke-width="1.2" />
      
      <!-- Section 1 -->
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">
        OS: <tspan fill="#f0fdf4" font-weight="600">Arch 6.12-zen</tspan>
      </text>

      <line x1="185" y1="9" x2="185" y2="33" stroke="#21262d" stroke-width="1" />

      <!-- Section 2 -->
      <text x="198" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">
        HTTPD: <tspan fill="#f0fdf4" font-weight="600">Apache/2.4 event</tspan>
      </text>

      <line x1="395" y1="9" x2="395" y2="33" stroke="#21262d" stroke-width="1" />

      <!-- Section 3 -->
      <text x="408" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">
        MOD: <tspan fill="#f0fdf4" font-weight="600">KernelSU / Reversing</tspan>
      </text>

      <circle cx="632" cy="21" r="3.5" fill="#4ade80" filter="url(#soft-glow)" />
    </g>
  </g>
</svg>
