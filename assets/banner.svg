<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Deep Forest Nature Gradient -->
    <linearGradient id="forest-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a" />
      <stop offset="50%" stop-color="#052917" />
      <stop offset="100%" stop-color="#011208" />
    </linearGradient>

    <!-- Emerald Leaf & Foliage Glow -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bio Organic Grid -->
    <pattern id="nature-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.2" fill="#4ade80" fill-opacity="0.25" />
    </pattern>

    <!-- Foliage Emerald Gradient -->
    <linearGradient id="foliage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Deep Nature Forest Background -->
  <rect width="960" height="280" rx="14" fill="url(#forest-bg-grad)" stroke="#165b38" stroke-width="1.8" />
  <rect width="960" height="280" rx="14" fill="url(#nature-grid)" />

  <!-- Inner Nature Highlight Ring -->
  <rect x="2" y="2" width="956" height="276" rx="12" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.25" />

  <!-- Top Terminal Bar (Forest Root Style) -->
  <path d="M 0 14 Q 0 0 14 0 L 946 0 Q 960 0 960 14 L 960 38 L 0 38 Z" fill="#02170d" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#165b38" stroke-width="1.2" />

  <!-- Terminal Window Dots -->
  <circle cx="25" cy="19" r="5.5" fill="#15803d" opacity="0.9" />
  <circle cx="43" cy="19" r="5.5" fill="#22c55e" opacity="0.9" />
  <circle cx="61" cy="19" r="5.5" fill="#4ade80" opacity="0.9" />

  <!-- Terminal Title -->
  <text x="50%" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#6ee7b7" letter-spacing="1">
    habnoir@arch-forest: ~ (zsh/nature-rice) — LINUX EVERGREEN KERNEL
  </text>

  <!-- Left: Living Pixel Bonsai Tree & Root System -->
  <g transform="translate(36, 60)">
    <!-- Ambient Green Nature Aura -->
    <circle cx="95" cy="95" r="80" fill="#22c55e" opacity="0.12" filter="url(#emerald-glow)" />

    <!-- Pot -->
    <polygon points="42,160 148,160 136,180 54,180" fill="#082918" stroke="#165b38" stroke-width="1.5" />
    <rect x="50" y="180" width="90" height="5" rx="2" fill="#03160c" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.5" />
    <!-- Moss Grass Line -->
    <line x1="45" y1="160" x2="145" y2="160" stroke="#4ade80" stroke-width="3" stroke-linecap="round" />

    <!-- Main Angled Bonsai Trunk -->
    <path d="M 90 160 Q 86 135 102 120 T 96 85 Q 92 65 110 50" fill="none" stroke="#713f12" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 90 160 Q 86 135 102 120 T 96 85 Q 92 65 110 50" fill="none" stroke="#854d0e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Branch Left -->
    <path d="M 97 122 Q 80 115 62 110" fill="none" stroke="#713f12" stroke-width="5" stroke-linecap="round" />
    <path d="M 97 122 Q 80 115 62 110" fill="none" stroke="#854d0e" stroke-width="3" stroke-linecap="round" />
    <!-- Branch Right High -->
    <path d="M 97 90 Q 120 85 138 78" fill="none" stroke="#713f12" stroke-width="4.5" stroke-linecap="round" />
    <!-- Branch Left High -->
    <path d="M 96 75 Q 80 65 68 58" fill="none" stroke="#713f12" stroke-width="3.5" stroke-linecap="round" />

    <!-- Foliage Canopies -->
    <ellipse cx="112" cy="42" rx="36" ry="18" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="102" cy="36" rx="24" ry="13" fill="#86efac" opacity="0.6" />
    <ellipse cx="126" cy="44" rx="19" ry="11" fill="#14532d" opacity="0.6" />

    <ellipse cx="140" cy="74" rx="28" ry="15" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="134" cy="70" rx="18" ry="10" fill="#86efac" opacity="0.6" />
    <ellipse cx="150" cy="77" rx="14" ry="8" fill="#14532d" opacity="0.5" />

    <ellipse cx="58" cy="106" rx="30" ry="16" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="52" cy="102" rx="20" ry="11" fill="#86efac" opacity="0.6" />
    <ellipse cx="68" cy="109" rx="15" ry="9" fill="#14532d" opacity="0.5" />

    <ellipse cx="65" cy="55" rx="20" ry="12" fill="url(#foliage-grad)" filter="url(#soft-glow)" />
    <ellipse cx="62" cy="52" rx="13" ry="8" fill="#86efac" opacity="0.6" />

    <!-- Spores -->
    <rect x="75" y="135" width="4" height="4" fill="#4ade80" opacity="0.9" />
    <rect x="125" y="115" width="3" height="3" fill="#22c55e" opacity="0.8" />
    <rect x="145" y="130" width="3" height="3" fill="#86efac" opacity="0.7" />
    <rect x="85" y="148" width="4" height="4" fill="#4ade80" opacity="0.8" />
    
    <!-- Plant Label -->
    <text x="95" y="202" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#4ade80" opacity="0.9" letter-spacing="1">
      🌿 GIT-BONSAI // LIVING CANOPY
    </text>
  </g>

  <!-- Vertical Forest Divider -->
  <line x1="248" y1="52" x2="248" y2="258" stroke="#165b38" stroke-width="1.5" />
  <circle cx="248" cy="155" r="3.5" fill="#4ade80" filter="url(#soft-glow)" />

  <!-- Right Section: Identity, Specs, Linux Evergreen Stack -->
  <g transform="translate(276, 62)">
    <!-- Terminal Prompt Line -->
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#a7f3d0">
      <tspan fill="#4ade80">🌲</tspan> <tspan fill="#86efac">habnoir@arch-forest</tspan><tspan fill="#6ee7b7">:~$</tspan> <tspan fill="#f0fdf4">tree /sys/kernel/contributions</tspan>
    </text>

    <!-- Main Name Title -->
    <g transform="translate(0, 48)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#f0fdf4" letter-spacing="-0.5">
        habNoir
      </text>
      <!-- Blinking Terminal Cursor positioned safely -->
      <rect x="156" y="-24" width="10" height="28" fill="#4ade80" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>

      <!-- Status Pill Aligned Right (No overlap) -->
      <g transform="translate(545, -20)">
        <rect width="108" height="24" rx="12" fill="#042113" stroke="#22c55e" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#4ade80" filter="url(#soft-glow)" />
        <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#4ade80">ONLINE // zen</text>
      </g>
    </g>

    <!-- Subtitle / Bio (Proper spacing, fits cleanly) -->
    <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#86efac">
      Arch Linux Hacker <tspan fill="#22c55e">|</tspan> Systems &amp; Low-Level <tspan fill="#22c55e">|</tspan> Android Modder <tspan fill="#22c55e">|</tspan> Apache Engine
    </text>

    <!-- Badges Row (Exact horizontal layout, 0 overlaps) -->
    <g transform="translate(0, 94)">
      <!-- 1. Arch Linux (w: 104) -->
      <g transform="translate(0, 0)">
        <rect width="104" height="24" rx="4" fill="#042113" stroke="#22c55e" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#4ade80" />
        <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a7f3d0">Arch Linux</text>
      </g>

      <!-- 2. C++20 (w: 60) -->
      <g transform="translate(110, 0)">
        <rect width="60" height="24" rx="4" fill="#042113" stroke="#16a34a" stroke-width="1" />
        <text x="30" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">C++20</text>
      </g>

      <!-- 3. Python (w: 72) -->
      <g transform="translate(176, 0)">
        <rect width="72" height="24" rx="4" fill="#042113" stroke="#15803d" stroke-width="1" />
        <text x="36" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">Python</text>
      </g>

      <!-- 4. Node.js (w: 78) -->
      <g transform="translate(254, 0)">
        <rect width="78" height="24" rx="4" fill="#042113" stroke="#22c55e" stroke-width="1" />
        <text x="39" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ade80">Node.js</text>
      </g>

      <!-- 5. PHP (w: 52) -->
      <g transform="translate(338, 0)">
        <rect width="52" height="24" rx="4" fill="#042113" stroke="#16a34a" stroke-width="1" />
        <text x="26" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">PHP</text>
      </g>

      <!-- 6. Apache (w: 86) -->
      <g transform="translate(396, 0)">
        <rect width="86" height="24" rx="4" fill="#042113" stroke="#22c55e" stroke-width="1" />
        <text x="43" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ade80">Apache 2.4</text>
      </g>

      <!-- 7. Android Mod (w: 102) -->
      <g transform="translate(488, 0)">
        <rect width="102" height="24" rx="4" fill="#042113" stroke="#4ade80" stroke-width="1" />
        <text x="51" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#86efac">Android Mod</text>
      </g>
    </g>

    <!-- Telemetry Row (Calibrated Boundaries - ZERO Collisions) -->
    <g transform="translate(0, 136)">
      <rect width="655" height="42" rx="6" fill="#031a0e" stroke="#165b38" stroke-width="1.2" />
      
      <!-- Section 1: OS / Kernel (x: 14, width ~180) -->
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">
        OS: <tspan fill="#f0fdf4" font-weight="600">Arch 6.12-zen</tspan>
      </text>

      <line x1="185" y1="9" x2="185" y2="33" stroke="#165b38" stroke-width="1" />

      <!-- Section 2: Server Engine (x: 198, width ~200) -->
      <text x="198" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">
        HTTPD: <tspan fill="#f0fdf4" font-weight="600">Apache/2.4 event</tspan>
      </text>

      <line x1="395" y1="9" x2="395" y2="33" stroke="#165b38" stroke-width="1" />

      <!-- Section 3: Lab Focus (x: 408, width ~240) -->
      <text x="408" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">
        MOD: <tspan fill="#f0fdf4" font-weight="600">KernelSU / Reversing</tspan>
      </text>

      <!-- Status dot inside telemetry box -->
      <circle cx="632" cy="21" r="3.5" fill="#4ade80" filter="url(#soft-glow)" />
    </g>
  </g>
</svg>
