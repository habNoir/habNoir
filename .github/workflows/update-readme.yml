name: Update Forest Graph & Repos in README

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:       # Allows manual trigger anytime
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync-ecosystem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Forest Tree Contribution Graph
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-forest-graph.js

      - name: Run Repository Auto-Updater Script
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-repos.js

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(nature): auto-regenerate forest tree graph & update repo showcase [skip ci]"
          file_pattern: "README.md assets/forest-graph.svg"
